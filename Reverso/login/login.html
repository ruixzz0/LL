<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-container">
      <form class="login-box" id="loginForm" method="get" action="../home/home.html">
        <h1>Entre em sua conta</h1>
        <div class="input-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu email"
            required
          />
        </div>
        <div class="input-group">
          <label for="password">Senha</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Digite sua senha"
              required
            />
            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Mostrar senha"
            >
              <span class="eye-icon">👁️</span>
            </button>
          </div>
          <small class="helper-text"
            >Mínimo de 8 caracteres, uma letra maiúscula e um número.</small
          >
        </div>
        <p class="form-message" id="message" role="alert"></p>
        <button type="submit">Entrar</button>
        <p class="help">
          Não tem conta? <a href="/register/register.html">Cadastre-se aqui!</a>
        </p>
      </form>
    </div>

    <script src="script/script.js"></script>
  </body>
</html>
